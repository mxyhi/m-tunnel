location = /health {
    proxy_pass http://127.0.0.1:18290/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://127.0.0.1:18291;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
