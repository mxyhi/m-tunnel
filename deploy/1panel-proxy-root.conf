}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:18290;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_http_version 1.1;
