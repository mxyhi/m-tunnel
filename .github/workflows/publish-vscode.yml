name: Publish VS Code extension

on:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - working-directory: apps/vscode-extension
        run: pnpm dlx @vscode/vsce@latest publish --no-dependencies --oidc
